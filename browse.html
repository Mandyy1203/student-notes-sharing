<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse notes | Student Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">📚 Student Notes</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="upload.html">Upload</a>
      <a href="login.html">Log in</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <div class="eyebrow">SHARED BY STUDENTS</div>
        <h1>Browse notes</h1>
        <p class="muted">Search for notes by title, subject, branch, or semester.</p>
      </div>
      <a class="button" href="upload.html">＋ Upload notes</a>
    </div>

    <div class="filters card">
      <label class="search-label">Search
        <input id="search" type="search" placeholder="Search note title or description…">
      </label>
      
      <label>Branch
        <select id="branch">
          <option value="">All branches</option>
          <option>ENTC</option>
          <option>Computer</option>
          <option>IT</option>
          <option>Electrical</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Other</option>
        </select>
      </label>
      
      <label>Semester
        <select id="semester">
          <option value="">All semesters</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
        </select>
      </label>
    </div>

    <div id="message" class="message"></div>
    <div id="notes-list" class="note-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/common.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
