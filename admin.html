<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Student Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">📚 Student Notes</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="browse.html">Browse</a>
      <a href="upload.html">Upload</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <div class="eyebrow">MODERATION</div>
        <h1>Admin dashboard</h1>
        <p class="muted">Review shared notes and manage subjects.</p>
      </div>
    </div>

    <p id="admin-loading" class="muted">Checking administrator access…</p>
    <div id="message" class="message"></div>

    <div id="admin-content" hidden>
      <section class="card form-card" style="margin-bottom: 2.5rem;">
        <h2>Add a subject</h2>
        <form id="subject-form">
          <div class="two-col">
            <label>Subject name<input name="name" required maxlength="100"></label>
            <label>Branch<input name="branch" required value="ENTC" maxlength="40"></label>
          </div>
          <label>Semester
            <select name="semester" required>
              <option value="">Select semester</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option>
            </select>
          </label>
          <button class="button" type="submit">Add subject</button>
        </form>
        <div id="subject-message" class="message"></div>
      </section>

      <section>
        <h2>Uploaded notes</h2>
        <div id="notes-list" class="admin-list"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
