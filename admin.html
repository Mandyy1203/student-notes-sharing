<main class="container">
    <div class="page-heading">
      <div>
        <div class="eyebrow">MODERATION</div>
        <h1>Admin dashboard</h1>
        <p class="muted">Review shared notes and manage subjects.</p>
      </div>
    </div>

    <!-- NEW: Loading text -->
    <p id="admin-loading" class="muted">Checking administrator access…</p>
    <div id="message" class="message"></div>

    <!-- NEW: Wrap the rest inside this hidden div -->
    <div id="admin-content" hidden>
      
      <section class="card form-card">
        <h2>Add a subject</h2>
        <form id="subject-form">
          <div class="two-col">
            <label>Subject name<input name="name" required maxlength="100"></label>
            <label>Branch<input name="branch" required value="ENTC" maxlength="40"></label>
          </div>
          <label>Semester
            <select name="semester" required>
              <option value="">Select semester</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option>
            </select>
          </label>
          <button class="button" type="submit">Add subject</button>
        </form>
        <div id="subject-message" class="message"></div>
      </section>
      
      <section>
        <h2>Uploaded notes</h2>
        <div id="notes-list" class="admin-list"></div>
      </section>

    </div>
  </main>
