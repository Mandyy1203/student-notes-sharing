<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Student Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">📚 Student Notes</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Create account</a>
    </nav>
  </header>
  <main class="auth-wrap">
    <form id="login-form" class="card form-card">
      <div class="eyebrow">WELCOME BACK</div>
      <h1>Log in</h1>
      <p class="muted">Access your student notes account.</p>
      
      <label>Email
        <input name="email" type="email" required autocomplete="email">
      </label>
      
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" minlength="6">
      </label>
      
      <button class="button full" type="submit">Log in</button>
      <div id="message" class="message" role="status"></div>
      
      <p class="muted center">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
